name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk IntradaySathi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IntradaySathi-apk
          path: IntradaySathi.apk

      - name: Publish APK to Releases (easy download on phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Intraday Sathi APK (latest)
          body: Debug build. Paper trading only. Download IntradaySathi.apk below.
          files: IntradaySathi.apk
